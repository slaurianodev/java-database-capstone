name: Backend Lint

on:
  push:
  pull_request:

jobs:
  checkstyle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Checkstyle
        run: |
          curl -L \
            https://github.com/checkstyle/checkstyle/releases/latest/download/checkstyle-all.jar \
            -o checkstyle.jar

      - name: Download Google Checkstyle rules
        run: |
          curl -L \
            https://raw.githubusercontent.com/checkstyle/checkstyle/master/src/main/resources/google_checks.xml \
            -o google_checks.xml

      - name: Run Checkstyle
        run: |
          java -jar checkstyle.jar \
            -c google_checks.xml \
            src/main/java/com/project/backend || true